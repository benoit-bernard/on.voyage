# OTLP collector. Services export with the .NET OTLP exporter (gRPC) to otel-collector:4317 (OTEL_EXPORTER_OTLP_ENDPOINT).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 256
    spike_limit_mib: 64
  batch: {}

  # Defence in depth (§17.1): the services already strip url.query and url.full (ServiceDefaults). The collector removes anything that
  # still looks like a position before it is stored. Position parameters: lat, lon, lng, bbox, minLat, minLng, maxLat, maxLng.
  transform/privacy:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - delete_key(attributes, "url.query")
          - delete_key(attributes, "http.query")
          - replace_pattern(attributes["url.full"], "(?i)(lat|lon|lng|bbox|minlat|minlng|maxlat|maxlng)=[^&\\s]*", "$$1=REDACTED")
          - replace_pattern(attributes["http.url"], "(?i)(lat|lon|lng|bbox|minlat|minlng|maxlat|maxlng)=[^&\\s]*", "$$1=REDACTED")
          - replace_pattern(attributes["http.target"], "(?i)(lat|lon|lng|bbox|minlat|minlng|maxlat|maxlng)=[^&\\s]*", "$$1=REDACTED")
    log_statements:
      - context: log
        statements:
          - delete_key(attributes, "url.query")
          - replace_pattern(body.string, "(?i)(lat|lon|lng|bbox|minlat|minlng|maxlat|maxlng)=[^&\\s]*", "$$1=REDACTED")

  # Loki indexes a few resource attributes as labels: promote the ones the dashboards use.
  resource/loki:
    attributes:
      - action: insert
        key: loki.resource.labels
        value: service.name, deployment.environment

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform/privacy, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, transform/privacy, resource/loki, batch]
      exporters: [otlphttp/loki]
  telemetry:
    logs:
      level: warn
