# Replaces the image's pg_hba.conf (hba_file in docker-compose.yml). Only the compose network can reach PostgreSQL; nothing is published.
# TYPE  DATABASE     USER  ADDRESS    METHOD
local   all          all              trust
host    all          all   127.0.0.1/32   scram-sha-256
host    all          all   ::1/128        scram-sha-256
# Replication connections (pg_basebackup from the backup service): same network as the server only.
host    replication  all   samenet    scram-sha-256
host    all          all   samenet    scram-sha-256
