name: mobile

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/Mobile/**', 'src/Web/OnVoyage.UI.Components/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['src/Mobile/**', 'src/Web/OnVoyage.UI.Components/**', '.github/workflows/mobile.yml']

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android
      - name: Build debug APK
        run: dotnet build src/Mobile/OnVoyage.App -f net10.0-android -c Debug -m:1 -p:AndroidPackageFormat=apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: src/Mobile/OnVoyage.App/bin/Debug/net10.0-android/*-Signed.apk
          if-no-files-found: warn
      - name: Publish AAB (Release)
        run: >
          dotnet publish src/Mobile/OnVoyage.App -f net10.0-android -c Release
          -p:AndroidPackageFormat=aab -o out/android
      # Signing (H-003): add -p:AndroidKeyStore=true with keystore secrets once the Play Console account exists.
      - uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: out/android/*.aab

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios
      # Compile check without code signing. IPA signing and TestFlight upload need the Apple
      # Developer secrets (H-003) and are added to this job once they exist.
      - name: Build iOS (device, no code signing)
        run: >
          dotnet build src/Mobile/OnVoyage.App -f net10.0-ios -c Release
          -p:RuntimeIdentifier=ios-arm64 -p:EnableCodeSigning=false -p:CodesignRequireProvisioningProfile=false
